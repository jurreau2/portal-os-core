name = "portal-os-core"
main = "src/index.js"
compatibility_date = "2024-01-01"
site = false

[durable_objects]
bindings = [
  { name = "IDENTITY_DO", class_name = "IdentityDO" }
]

[[routes]]
pattern = "/identity/*"
script = "portal-os-core"

[[routes]]
pattern = "/mode/*"
script = "portal-os-core"

[[routes]]
pattern = "/force/*"
script = "portal-os-core"

[[routes]]
pattern = "/context/*"
script = "portal-os-core"

[[routes]]
pattern = "/portal/*"
script = "portal-os-core"
